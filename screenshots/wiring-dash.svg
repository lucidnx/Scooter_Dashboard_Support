<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="600" rx="16" fill="#fdfdfc" stroke="#e3e0d8" stroke-width="2"/>
  <text x="450" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#2f3437">Dashboard connection</text>

  <!-- wires -->
  <g stroke-linecap="round" stroke-width="9" fill="none">
    <path d="M170 116 L170 500" stroke="#d13b34"/>
    <path d="M310 116 L310 500" stroke="#1b1b1b"/>
    <path d="M450 116 L450 180" stroke="#f0932b"/>
    <path d="M590 116 L590 500" stroke="#3fa45b"/>
    <path d="M730 116 L730 500" stroke="#e8c020"/>
  </g>

  <!-- 1k from 3.3V across to the button line, capacitors across 5V and GND -->
  <g stroke-linecap="round" stroke-width="7" fill="none">
    <path d="M450 180 L590 180" stroke="#f0932b"/>
    <path d="M170 350 L310 350" stroke="#6b6b6b"/>
    <path d="M170 415 L310 415" stroke="#6b6b6b"/>
  </g>
  <g fill="#1b1b1b">
    <circle cx="590" cy="180" r="6"/>
    <circle cx="170" cy="350" r="6"/>
    <circle cx="310" cy="350" r="6"/>
    <circle cx="170" cy="415" r="6"/>
    <circle cx="310" cy="415" r="6"/>
  </g>

  <!-- clip-on ferrite over the whole bundle -->
  <rect x="130" y="240" width="640" height="44" rx="12" fill="#efece2" fill-opacity="0.94" stroke="#a9a494" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="450" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#6b6656">clip-on ferrite &#183; 5 mm &#183; optional</text>

  <!-- components -->
  <rect x="482" y="163" width="76" height="34" rx="8" fill="#ffffff" stroke="#2f3437" stroke-width="2"/>
  <text x="520" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3437">1 k&#8486;</text>

  <rect x="184" y="331" width="112" height="38" rx="8" fill="#ffffff" stroke="#2f3437" stroke-width="2"/>
  <text x="240" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3437">220 &#181;F</text>
  <text x="174" y="324" font-size="16" font-weight="700" fill="#d13b34">+</text>

  <rect x="184" y="396" width="112" height="38" rx="8" fill="#ffffff" stroke="#2f3437" stroke-width="2"/>
  <text x="240" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3437">1 &#181;F</text>

  <!-- endpoints -->
  <rect x="50" y="56" width="800" height="60" rx="12" fill="#2f3437"/>
  <text x="72" y="92" font-size="17" font-weight="700" fill="#ffffff">VESC</text>
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="170" y="92">5V</text>
    <text x="310" y="92">GND</text>
    <text x="450" y="92">3.3V</text>
    <text x="590" y="92">RX</text>
    <text x="730" y="92">TX</text>
  </g>

  <rect x="50" y="500" width="800" height="60" rx="12" fill="#2f3437"/>
  <text x="72" y="536" font-size="17" font-weight="700" fill="#ffffff">DASH</text>
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="170" y="536">5V</text>
    <text x="310" y="536">GND</text>
    <text x="590" y="536">Button</text>
    <text x="730" y="536">UART</text>
  </g>

  <text x="450" y="586" text-anchor="middle" font-size="13" fill="#6b6b6b">Both capacitors across 5V and GND, as close to the dashboard as the wiring allows</text>
</svg>
